# Companion to ci.yml. Because ci.yml is path-filtered, a docs-only change never
# starts it, and the required `ci-ok` check would sit at "Expected" forever,
# blocking the PR. This workflow carries the same workflow name and the same job
# name on the exact inverse path filter, so `ci-ok` always reports exactly once.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'app/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    steps:
      - name: nothing to build
        run: echo "No changes under app/ or the CI config — skipping build, lint and tests."
