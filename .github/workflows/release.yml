name: Release

# A semver tag is the only trigger. Nothing is published from a branch push, so
# every image in the registry corresponds to a tag somebody created on purpose.
on:
  push:
    tags:
      - "v*"

# The workflow token starts read-only. The one extra right the job needs is
# permission to write packages, which is what a push to ghcr.io uses.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/quicknotes

jobs:
  publish:
    name: build and push to ghcr.io
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # Lifted to the job so the deploy step can test it in an `if`. The
      # `secrets` context is not available in a step-level condition.
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # The Dockerfile lives in app/ and expects app/ as the build context.
          context: ./app
          # Render runs linux/amd64. The runner is amd64 too, so this needs no
          # emulation, and it avoids shipping an arm64-only image by accident.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what was published
        run: |
          echo "digest: ${{ steps.push.outputs.digest }}"
          echo "tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Redeploy Render
        # Runs only when the deploy hook secret is set, so the workflow still
        # succeeds for a deployment that does not use Render.
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The hook URL already carries a ?key=..., so the image goes on with
          # &, and the tag separators have to be percent encoded.
          encoded="$(printf '%s' "$IMAGE" | jq -sRr @uri)"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "${RENDER_DEPLOY_HOOK}&imgURL=${encoded}")"
          echo "deploy hook returned HTTP $code for $IMAGE"
          test "$code" = "200"
